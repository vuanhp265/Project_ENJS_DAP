<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <nav class="navbar">
        <h2 class="logo">Student Portal</h2>
        <ul>
        <li><a href="/">Trang chủ</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/chat">Chat Box</a></li>
        <li><a href="/loginpage">Đăng nhập</a></li>
        </ul>
    </nav>
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
            </path>
          </svg>
        </div>
        <h1 class="text-blue-600 mb-2">Đăng Nhập</h1>
        <p class="text-gray-600">Chào mừng bạn trở lại!</p>
      </div>
      <div id="error-box" class="hidden mb-6 bg-red-50 border border-red-300 rounded-lg p-4 flex items-start gap-3">
        <svg class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd"></path>
        </svg>
        <div>
          <h3 class="text-red-800">Đăng nhập không thành công!</h3>
          <p class="text-red-600 mt-1">Email hoặc mật khẩu không chính xác. Vui lòng thử lại.</p>
        </div>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-6">
        
        <div class="space-y-2">
          <label for="email" class="block text-gray-700">
            Email <span class="text-red-500">*</span>
          </label>
          <input type="email" id="email" name="email" required placeholder="nguyenvana@example.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>

        <div class="space-y-2">
          <label for="password" class="block text-gray-700">
            Mật khẩu <span class="text-red-500">*</span>
          </label>
          <input type="password" id="password" name="password" required placeholder="••••••••"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
            <span class="ml-2 text-gray-700">Ghi nhớ đăng nhập</span>
          </label>
          <button type="button" class="text-blue-600 hover:text-blue-700 hover:underline">
            Quên mật khẩu?
          </button>
        </div>

        <button type="submit"
          class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors duration-200 shadow-lg hover:shadow-xl">
          Đăng Nhập
        </button>

        <div class="text-center mt-4">
        <p class="text-gray-600">
            Chưa có tài khoản?
            <a href="/registerpage" class="text-blue-600 hover:text-blue-700 hover:underline">
            Đăng ký ngay
            </a>
        </p>
        </div>


      </form>
    </div>
  </div>

</body>
</html>
