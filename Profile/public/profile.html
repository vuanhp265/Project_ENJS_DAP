<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Profile - Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h2 class="logo">Student Portal</h2>
    <ul>
      <li><a href="/">Trang chủ</a></li>
      <li><a href="/profile.html">Profile</a></li>
      <li><a href="/chat">Chat Box</a></li>
      <li><a href="/loginpage">Đăng nhập</a></li>
    </ul>
  </nav>

  <section class="profile">
    <div class="profile-card" id="profile-card">
      Loading profile...
    </div>
  </section>

  <script>
    // Lấy studentId từ localStorage (được lưu khi đăng ký)
    const studentId = localStorage.getItem("studentId");

    async function loadProfile() {
      const card = document.getElementById("profile-card");

      if (!studentId) {
        card.innerHTML = "<p>Chưa có sinh viên nào đăng nhập.</p>";
        return;
      }

      try {
        const res = await fetch(`/api/profile/${studentId}`);
        const data = await res.json();

        if (data.success) {
          const s = data.student;
          card.innerHTML = `
            <img src="https://i.pravatar.cc/150?img=3" class="avatar">
            <h2>${s.name}</h2>
            <p class="muted">MSSV: ${s.studentId}</p>
            <p>📍 Địa chỉ: ${s.address}</p>
            <p>📧 Email: ${s.email}</p>
            <p>📱 SĐT: ${s.phone}</p>

            <ul class="skills">
              ${s.skills.split(",").map(skill => `<li>${skill.trim()}</li>`).join("")}
            </ul>

            <button onclick="window.location.href='/'">⬅ Quay lại Trang chủ</button>
          `;
        } else {
          card.innerHTML = `<p>${data.message}</p>`;
        }
      } catch (err) {
        card.innerHTML = "<p>🚨 Lỗi kết nối server!</p>";
      }
    }

    loadProfile();
  </script>
</body>
</html>
